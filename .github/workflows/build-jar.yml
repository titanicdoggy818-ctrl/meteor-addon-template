name: Build 1.21.11 jar

on:
  push:
    branches: [ mc-1.21.11 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: growth-detector-jar
          path: build/libs/*.jar
